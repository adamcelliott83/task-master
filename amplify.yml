version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Generate the Prisma client from the schema (no DB connection needed)
        - npx prisma generate
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
